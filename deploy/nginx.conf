limit_req_zone $binary_remote_addr zone=servicepilot_api:10m rate=30r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  auth_basic "ServicePilot Demo";
  auth_basic_user_file /etc/nginx/htpasswd;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req zone=servicepilot_api burst=20 nodelay;
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header oai-authenticated-user-email demo-admin@servicepilot.local;
    proxy_read_timeout 180s;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
