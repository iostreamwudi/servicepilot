limit_req_zone $binary_remote_addr zone=servicepilot_api:10m rate=30r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    limit_req zone=servicepilot_api burst=20 nodelay;
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header oai-authenticated-user-email demo-admin@servicepilot.local;
    proxy_read_timeout 180s;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# The local Worker runtime has a stricter TLS trust store than Node. Keep the
# model gateway private and let Nginx terminate the upstream TLS connection.
server {
  listen 3100;
  server_name _;
  client_max_body_size 1m;

  location = /compatible-mode/v1/chat/completions {
    proxy_pass https://dashscope.aliyuncs.com;
    proxy_ssl_server_name on;
    proxy_ssl_name dashscope.aliyuncs.com;
    proxy_set_header Host dashscope.aliyuncs.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type application/json;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  location / {
    return 404;
  }
}
