services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - servicepilot-data:/data
      # Wrangler resolves .dev.vars next to the config file (/app/deploy).
      # Keep the secret outside git while mounting it at the path Wrangler loads.
      - ./secrets/.dev.vars:/app/deploy/.dev.vars:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      - servicepilot

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/portfolio/current:/usr/share/nginx/html/portfolio:ro
    networks:
      - servicepilot

volumes:
  servicepilot-data:

networks:
  servicepilot:
